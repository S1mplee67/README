name: Refresh profile graphics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: S1mplee67
          outputs: |
            assets/contribution-snake.svg
            assets/contribution-snake-dark.svg?palette=github-dark
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Refresh profile graphics
          file_pattern: assets/*.svg
