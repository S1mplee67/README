name: Check profile artwork

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - .github/workflows/update-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVG artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          for path in Path('assets').glob('*.svg'):
              ET.parse(path)
              print('OK:', path)

          for filename in ('contribution-farm.svg', 'contribution-farm-light.svg', 'project-preview.svg'):
              text = (Path('assets') / filename).read_text(encoding='utf-8')
              if '@keyframes' not in text:
                  raise SystemExit(f'Missing animation in {filename}')
              if filename.startswith('contribution-farm'):
                  if '34 CONTRIBUTIONS / 4 DAYS' not in text or text.count('<title>2026-10-') != 4:
                      raise SystemExit(f'Contribution snapshot mismatch in {filename}')
          PY
