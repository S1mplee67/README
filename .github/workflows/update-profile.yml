name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-profile.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs from S1mplee67 contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: S1mplee67
          outputs: |
            assets/contribution-snake.svg?palette=github-light
            assets/contribution-snake-dark.svg?palette=github-dark

      - name: Commit updated snake graphics
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update contribution snake [skip ci]"
          file_pattern: "assets/contribution-snake*.svg"
